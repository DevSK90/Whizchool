name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Unit tests plus the /api/v1 contract suite against the demo API.
      - run: npm test -w @whizchool/web

  api:
    name: API tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: whizchool
          POSTGRES_PASSWORD: whizchool
          POSTGRES_DB: whizchool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whizchool -d whizchool_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://whizchool:whizchool@localhost:5432/whizchool_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w @whizchool/api
      - run: npm run build -w @whizchool/api

  e2e:
    name: E2E (Playwright, Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -w @whizchool/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
