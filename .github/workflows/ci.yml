name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, web tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Unit tests plus the /api/v1 contract suite against the demo API.
      - run: npm test -w @whizchool/web

  api:
    name: API tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: whizchool
          POSTGRES_PASSWORD: whizchool
          POSTGRES_DB: whizchool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U whizchool -d whizchool_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://whizchool:whizchool@localhost:5432/whizchool_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w @whizchool/api
      # The web app's contract suite over HTTP, against a real API with the test reset route.
      - name: Contract tests against the real API
        env:
          CONTRACT_DB: postgresql://whizchool:whizchool@localhost:5432/whizchool_contract
        run: |
          psql "postgresql://whizchool:whizchool@localhost:5432/postgres" -c "CREATE DATABASE whizchool_contract"
          (cd apps/api && DATABASE_URL=$CONTRACT_DB npx prisma migrate deploy)
          (cd apps/api && NODE_ENV=test PORT=4100 DATABASE_URL=$CONTRACT_DB APP_URL=http://localhost:3000 \
            EMAIL_TRANSPORT=log ENABLE_TEST_ROUTES=true LOG_LEVEL=warn node --import tsx src/main.ts &)
          for i in $(seq 1 30); do curl -sf http://localhost:4100/api/v1/health && break; sleep 1; done
          CONTRACT_API_URL=http://localhost:4100/api/v1 npm run test:contract:api -w @whizchool/web
      - run: npm run build -w @whizchool/api

  e2e:
    name: E2E (Playwright, Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -w @whizchool/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
